<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClariFact</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="spark-icon">✨</span>
        <span>ClariFact</span>
      </div>
      <div class="sidebar-section">
        <button class="sidebar-btn new-chat">New chat</button>
        <h4>Recent</h4>
        <div class="recent-list" id="recent-list">
          <div class="empty-state">No analyses yet</div>
        </div>
      </div>
      <div class="sidebar-footer">
        <small>ClariFact can make mistakes. Verify important information.</small>
      </div>
    </aside>
    <main class="main">
      <header class="toolbar">
        <h1 class="main-title">Where should we start?</h1>
      </header>
      <section class="input-section" id="input-section">
        <form id="analyze-form" class="input-container">
          <label for="file-input" class="attach-btn" id="add-btn">+</label>
          <input type="file" id="file-input" style="display:none" accept="image/*,video/*,audio/*,.mp4,.mov,.avi,.mp3,.wav,.png,.jpg,.jpeg">
          <div id="file-preview" class="file-preview" style="display:none;"></div>
          <textarea id="text-input" placeholder="Paste a claim, caption, or link..."></textarea>
          <button type="submit" id="send-btn" class="send-btn">Send</button>
        </form>
              </section>
      <div class="chat-area" id="chat-area">
        <!-- messages and results inserted by JS -->
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
